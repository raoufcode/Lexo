<!doctype html>
<html lang="fr" data-lexo-test>
<head>
  <meta charset="utf-8">
  <title>Lexo — page de test</title>
  <style>
    body { font: 16px/1.5 Georgia, serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    textarea, input, .editor { width: 100%; font: inherit; padding: 10px; border: 1px solid #bbb; border-radius: 8px; box-sizing: border-box; }
    .editor { min-height: 90px; }
    label { display: block; margin: 18px 0 6px; font-family: system-ui; font-size: 13px; color: #555; }
  </style>
</head>
<body>
  <h1>Page de test Lexo</h1>
  <label for="ta">Textarea</label>
  <textarea id="ta" rows="5"></textarea>
  <label for="inp">Input</label>
  <input id="inp" type="text">
  <label>Contenteditable</label>
  <div id="ce" class="editor" contenteditable="true"><p><br></p></div>
  <label for="pwd">Mot de passe (ignoré)</label>
  <input id="pwd" type="password">
</body>
</html>
